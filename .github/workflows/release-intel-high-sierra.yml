name: Release Intel macOS 10.13 compatibility candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the separately named Intel DMG
        required: true
        default: v0.1.3
        type: string

permissions:
  contents: write

jobs:
  build-intel-compatibility-candidate:
    name: Build signed Intel macOS 10.13 candidate
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"

    steps:
      - name: Check out requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Check out compatibility build files
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.sha }}
        run: |
          git checkout "$WORKFLOW_REF" -- \
            .github/workflows/release-intel-high-sierra.yml \
            src-tauri/tauri.intel-high-sierra.conf.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust with Intel target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Verify tag and compatibility configuration
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const compat = JSON.parse(fs.readFileSync('src-tauri/tauri.intel-high-sierra.conf.json', 'utf8'));
          const tagVersion = '${{ inputs.release_tag }}'.replace(/^v/, '');
          if (base.version !== tagVersion) throw new Error(`Tag version ${tagVersion} does not match app version ${base.version}`);
          if (compat.bundle?.macOS?.minimumSystemVersion !== '10.13') throw new Error('Intel compatibility minimumSystemVersion must be 10.13');
          NODE

      - name: Require complete Apple signing credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            if [[ -z "${!name}" ]]; then
              echo "Required signing secret $name is missing or empty." >&2
              exit 1
            fi
          done

      - name: Import Developer ID Application certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ilegallearn-intel-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Reconstruct App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple Intel app and DMG
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          npm run tauri -- build \
            --target x86_64-apple-darwin \
            --bundles app,dmg \
            --config src-tauri/tauri.intel-high-sierra.conf.json

      - name: Verify architecture, deployment target, signature, and notarization tickets
        id: verify
        shell: bash
        run: |
          BUNDLE_ROOT="src-tauri/target/x86_64-apple-darwin/release/bundle"
          APP_PATH="$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          [[ -n "$APP_PATH" && -n "$DMG_PATH" ]]

          BINARY_PATH="$APP_PATH/Contents/MacOS/ilegallearn-desktop"
          [[ -f "$BINARY_PATH" ]]
          file "$BINARY_PATH"
          [[ "$(lipo -archs "$BINARY_PATH")" == "x86_64" ]]

          LOAD_COMMANDS="$(otool -l "$BINARY_PATH")"
          printf '%s\n' "$LOAD_COMMANDS"
          DEPLOYMENT_TARGET="$(printf '%s\n' "$LOAD_COMMANDS" | awk '
            $2 == "LC_BUILD_VERSION" { build = 1; legacy = 0; next }
            build && $1 == "minos" { print $2; exit }
            $2 == "LC_VERSION_MIN_MACOSX" { legacy = 1; build = 0; next }
            legacy && $1 == "version" { print $2; exit }
          ')"
          [[ "$DEPLOYMENT_TARGET" == "10.13" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP_PATH/Contents/Info.plist")" == "10.13" ]]

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

          VERSION="${{ inputs.release_tag }}"
          VERSION="${VERSION#v}"
          OUTPUT_DMG="$BUNDLE_ROOT/dmg/iLegalLearn_${VERSION}_intel-macos10.13.dmg"
          mv "$DMG_PATH" "$OUTPUT_DMG"
          echo "dmg_path=$OUTPUT_DMG" >> "$GITHUB_OUTPUT"
          echo "deployment_target=$DEPLOYMENT_TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload verified Intel candidate to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iLegalLearn-${{ inputs.release_tag }}-intel-macos10.13
          path: ${{ steps.verify.outputs.dmg_path }}
          if-no-files-found: error

      - name: Publish separately named DMG on existing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.release_tag }}"
          gh release upload "${{ inputs.release_tag }}" "${{ steps.verify.outputs.dmg_path }}" --clobber

      - name: Compatibility status
        shell: bash
        run: |
          echo "Built and verified an x86_64 candidate with deployment target ${{ steps.verify.outputs.deployment_target }}."
          echo "Runtime compatibility remains pending testing on physical macOS 10.13.6 hardware."
